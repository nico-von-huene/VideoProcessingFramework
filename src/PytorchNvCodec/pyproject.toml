[build-system]        
requires = [
  "setuptools >=42,<72",
  "torch==2.7.0+cu128",
  "torchvision==0.22.0+cu128",
  "numpy>=1.24.4",
  ## out-comment not install cmake/ninja via pip
  "cmake>=3.21,<4.0",
  "ninja; platform_system!='Windows'",
  "pkgconfig",
  "scikit-build>=0.13",
]
build-backend = "setuptools.build_meta"
[project]
name = "PytorchNvCodec"
version = "2.0.0"
authors = [{name = "NVIDIA"},]
description = """VPF stands for Video Processing Framework. It’s set of C++ libraries and Python bindings which provides full HW acceleration for video processing tasks such as decoding, encoding, transcoding and GPU-accelerated color space and pixel format conversions. VPF also supports exporting GPU memory objects such as decoded video frames to PyTorch tensors without Host to Device copies."""
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA :: 12.8",
    "Programming Language :: Python :: 3",
]
dependencies = [
  "torch==2.7.0+cu128",
  "torchvision==0.22.0+cu128",
  "numpy>=1.24.4",
]

# +cu128 wheels are not on PyPI. Isolated Poetry/pip builds of this package
# look up torch/torchvision here instead of the retired pypi.ngc.nvidia.com host.
[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "supplemental"

[[tool.poetry.source]]
name = "pypi-nvidia"
url = "https://pypi.nvidia.com"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.10"
torch = {version = "2.7.0+cu128", source = "pytorch-cu128"}
torchvision = {version = "0.22.0+cu128", source = "pytorch-cu128"}
numpy = ">=1.24.4"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
